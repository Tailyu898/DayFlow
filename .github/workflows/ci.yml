name: DAYFLOW verification and Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dayflow-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check syntax, assets and tests
        run: node scripts/verify.mjs
      - name: Package verified frontend
        run: tar -czf dayflow-verified.tar.gz -C dist .
      - name: Save verified frontend
        uses: actions/upload-artifact@v7
        with:
          name: dayflow-${{ github.sha }}
          path: dayflow-verified.tar.gz
          retention-days: 7
          if-no-files-found: error

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: dayflow-pages
      cancel-in-progress: false
    steps:
      - name: Check out verified source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload app directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy public trial app
        id: deployment
        uses: actions/deploy-pages@v5

<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#246451"><title>日序 · 手機試用紀錄</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="themes.css"><style>main{max-width:800px;margin:auto;padding:24px 16px}h1{font-size:25px}.trial-item{margin:18px 0;padding:16px;border:1px solid var(--line);border-radius:12px}.trial-item h2{font-size:16px;margin:0 0 8px}.trial-item p{font-size:13px;line-height:1.8;color:var(--muted)}.trial-item select,.trial-item textarea,#device{width:100%;padding:10px;margin:6px 0;border:1px solid var(--line);border-radius:8px;background:var(--field);color:inherit;font:inherit}.trial-item textarea{min-height:75px;resize:vertical}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.timestamp{font-size:11px;color:var(--muted)}#saved{font-size:12px;color:var(--green);min-height:24px}a.primary{display:inline-block;padding:11px 15px;border-radius:10px}.trial-item:has(option[value="問題"]:checked){border-color:#c78445}</style></head>
<body><main><div class="eyebrow">DAYFLOW · FIELD NOTES</div><h1>日序 · 手機試用紀錄</h1><p class="muted" style="font-size:13px;line-height:1.9">一邊試用，一邊記下操作結果。此頁只將紀錄儲存在目前手機瀏覽器，不會自動傳回電腦或錄製螢幕。</p><div class="toolbar"><a class="primary" href="./" target="_blank" rel="noopener">開啟日序 ↗</a><button id="export">匯出試用紀錄</button></div><section class="panel"><label class="field">手機型號／系統／瀏覽器<input id="device" placeholder="例如：iPhone、iOS、Safari"></label><div id="saved" role="status" aria-live="polite"></div><div id="items"></div><label class="field">整體感受與最想改善的三件事<textarea id="summary" maxlength="10000" placeholder="哪些步驟順暢？哪些地方不好找或需要重複輸入？"></textarea></label></section><p class="small muted" style="line-height:1.8">填寫會自動儲存在本機。完成後請按「匯出試用紀錄」，再將檔案提供給我整理。若切換網址、瀏覽器或清除網站資料，可能看不到原有紀錄。</p></main>
<script>
const cases=[
 ['連線與首頁','連接與電腦相同的 Wi-Fi，開啟日序，確認首頁與行程選單顯示正常。'],
 ['建立日常或工作行程','建立兩日行程，加入一個外出活動、一個居家活動或線上會議。'],
 ['調整時間與衝突檢查','建立兩個重疊活動，確認警告；再調整時間，確認警告解除。'],
 ['每日／每週重複','在行程日期內建立重複活動，切換日期確認；編輯其中一筆，確認其他筆保留。'],
 ['地點與路徑','為至少兩筆活動填入地址，在地點與路徑頁開啟當日路線，確認地點順序。交通時間需自行填寫。'],
 ['照片、飲食與費用紀錄','記錄一筆活動的照片、心得、費用及實際時間；重新整理後確認資料仍在。'],
 ['備份與匯入','匯出完整備份，確認手機可找到下載檔；再匯入並確認資料完整。匯入採合併方式，會保留原行程並產生匯入副本。'],
 ['行事曆提醒','匯出 .ics 並匯入手機行事曆，確認日期、時間、提醒和通知權限。'],
 ['外出與連線限制',(/^(localhost|127\.|192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname)?'目前為同 Wi-Fi 本機試用。電腦需保持開機；離開區網後網址無法連線，區網 HTTP 不支援離線重開。記下這項限制對你的使用影響。':'在私人網址下可使用行動網路或其他 Wi-Fi。確認手機登入有權限的帳號並能開啟日序，記錄重新開啟、訊號不佳及離線時的行為。')],
 ['整體操作與顯示','檢查字體、按鈕、橫向溢出、輸入速度與照片選取操作；記下希望改善的地方。']
];
const key='dayflow-trial-v1';let report;let storageOK=true;try{report=JSON.parse(localStorage.getItem(key)||'null');}catch{storageOK=false;}
if(!report||!Array.isArray(report.results)||report.results.length!==cases.length)report={started:new Date().toISOString(),updated:'',device:'',summary:'',results:cases.map(()=>({status:'待測',note:'',updated:''}))};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelector('#device').value=report.device;document.querySelector('#summary').value=report.summary;
document.querySelector('#items').innerHTML=cases.map(([title,instruction],i)=>`<section class="trial-item"><h2>${i+1}. ${esc(title)}</h2><p>${esc(instruction)}</p><label class="field">測試結果<select data-index="${i}" data-field="status" aria-label="${esc(title)}的測試結果">${['待測','通過','問題','不適用'].map(s=>`<option ${report.results[i].status===s?'selected':''}>${s}</option>`).join('')}</select></label><label class="field">操作過程／結果／問題<textarea data-index="${i}" data-field="note" maxlength="10000" placeholder="例如：按下哪個按鈕、預期什麼、實際發生什麼？">${esc(report.results[i].note)}</textarea></label><div class="timestamp" id="time-${i}">${report.results[i].updated?'更新：'+esc(new Date(report.results[i].updated).toLocaleString()):'尚未測試'}</div></section>`).join('');
const saved=document.querySelector('#saved');saved.textContent=storageOK?(report.updated?'上次儲存：'+new Date(report.updated).toLocaleString():'尚未填寫；請完成一個項目後選擇結果。'):'瀏覽器儲存可能不可用，填寫後請直接匯出。';
function save(e){const el=e.target;report.updated=new Date().toISOString();if(el.id==='device')report.device=el.value;else if(el.id==='summary')report.summary=el.value;else if(el.dataset.field){const r=report.results[Number(el.dataset.index)];r[el.dataset.field]=el.value;r.updated=report.updated;document.querySelector('#time-'+el.dataset.index).textContent='更新：'+new Date(r.updated).toLocaleString();}else return;try{localStorage.setItem(key,JSON.stringify(report));saved.textContent='已儲存於本機：'+new Date(report.updated).toLocaleString();}catch{saved.textContent='儲存失敗，請立即匯出紀錄以免遺失。';}}
document.addEventListener('input',save);document.addEventListener('change',save);
document.querySelector('#export').onclick=()=>{const lines=['日序手機試用紀錄','開始：'+new Date(report.started).toLocaleString(),'裝置：'+report.device,'匯出：'+new Date().toLocaleString(),''];cases.forEach(([title,instruction],i)=>{const r=report.results[i];lines.push((i+1)+'. '+title,'測試項目：'+instruction,'結果：'+r.status,'操作與問題：'+(r.note||'尚未填寫'),'更新：'+(r.updated?new Date(r.updated).toLocaleString():'尚未測試'),'');});lines.push('整體感受與改善建議',report.summary||'尚未填寫');const url=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='日序手機試用紀錄-'+new Date().toLocaleDateString('sv-SE')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);saved.textContent='已匯出，請確認手機下載資料夾。';};
</script><script type="module" src="trial-display.js"></script></body></html>
